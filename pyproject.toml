[project]
name = "riigikogu-stenogram-search"
version = "0.1.0"
description = "Riigikogu stenogrammide otsing ja analüütika"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
# Target Python version
target-version = "py310"

# Set line length
line-length = 100

# Directories and files to exclude
exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "data",
    "database",
    "src/frontend",
    "__pycache__",
]

[tool.ruff.lint]
# Select rules:
# E / W: pycodestyle errors and warnings
# F: Pyflakes (unused imports, undefined variables, etc.)
# I: isort (organized imports)
# UP: pyupgrade (modern Python syntax)
# B: flake8-bugbear (common design issues and bugs)
select = ["E", "W", "F", "I", "UP", "B"]

# Ignore specific rules if needed
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
