name: Live API Shape Check

on:
  schedule:
    # Every Monday at 10:00 UTC
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-live-api:
    name: Check Live API Shape
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Run Live API Check
        run: python3 scripts/check_live_api.py

      # Only the upstream check needs a package (src/fetch_models); take Pydantic and its
      # dependencies at the versions pinned in requirements.txt, so Dependabot keeps them current
      - name: Install Pydantic for Upstream Check
        if: always()
        run: |
          grep -E '^(pydantic|pydantic-core|annotated-types|typing-extensions|typing-inspection)=='             requirements.txt > /tmp/pydantic-requirements.txt
          test "$(wc -l < /tmp/pydantic-requirements.txt)" -eq 5
          pip install --no-deps -r /tmp/pydantic-requirements.txt
          pip check

      - name: Run Upstream Riigikogu API Check
        if: always()
        run: python3 scripts/check_upstream_api.py
