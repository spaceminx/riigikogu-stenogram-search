name: Riigikogu Daily Data Pipeline

# Manual fallback data pipeline (runs when triggered via workflow_dispatch).
# The scheduled daily pipeline has been migrated to run directly on the server.
on:
  workflow_dispatch:

concurrency:
  group: riigikogu-daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The same script as the server cron, so the fallback fails and skips the upload in the same
      # cases (upstream schema change, required fetch or integrity failure). No database here.
      - name: Run the daily pipeline without the database sync
        env:
          PYTHONPATH: ${{ github.workspace }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: python scripts/daily_pipeline.py --no-sync
