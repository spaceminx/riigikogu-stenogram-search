name: Riigikogu Daily Data Pipeline

on:
  schedule:
    # Pipeline runs at 01:12 AM UTC
    - cron: '12 1 * * *'

  workflow_dispatch:

concurrency:
  group: riigikogu-daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 1. Download current state and data from B2
        env:
          PYTHONPATH: ${{ github.workspace }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: python scripts/download_from_b2.py

      - name: 2. Fetch parliamentary memberships
        env:
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true
        run: python scripts/fetch_memberships.py

      - name: 3. Fetch member factions
        env:
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true
        run: python scripts/fetch_factions.py

      - name: 4. Fetch and process new stenograms from API
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fetch_stenograms_api.py

      - name: 5. Fetch new attendance records from API
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fetch_attendance.py

      - name: 6. Upload updated data and sync state back to Backblaze B2
        if: !cancelled()
        env:
          PYTHONPATH: ${{ github.workspace }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: python scripts/upload_to_b2.py

