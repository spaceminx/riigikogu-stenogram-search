name: Riigikogu Daily Data Pipeline

on:
  schedule:
    # Pipeline runs at 01:12 AM UTC
    - cron: '12 1 * * *'

  workflow_dispatch:

concurrency:
  group: riigikogu-daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Data Pipeline (Download B2 -> Sync API -> Upload B2)
        env:
          PYTHONPATH: ${{ github.workspace }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          # 1. Download current state and data from B2
          python scripts/download_from_b2.py

          # 2. Fetch member factions
          python scripts/fetch_factions.py

          # 3. Fetch and process new stenograms from API
          python scripts/fetch_stenograms_api.py

          # 4. Fetch new attendance records from API
          python scripts/fetch_attendance.py

          # 5. Upload updated data and sync state back to Backblaze B2
          python scripts/upload_to_b2.py

