name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Auto-Deploy to Server
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Verify DEPLOY_DIR is configured
        run: |
          DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
          if [ -z "$DEPLOY_DIR" ]; then
            echo "Error: secrets.DEPLOY_DIR is not set. Please configure DEPLOY_DIR in repository secrets (Settings -> Secrets and variables -> Actions -> Secrets)."
            exit 1
          fi

      - name: Pull latest code and rebuild Docker
        run: |
          DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
          git config --global --add safe.directory "$DEPLOY_DIR"
          cd "$DEPLOY_DIR" || exit 1
          git fetch origin master && git reset --hard origin/master

          # Wait for database sync to finish before rebuilding/restarting Docker.
          # The pipeline holds a kernel lock (flock) on the file; a file left by a killed run
          # is not locked and does not block the deploy.
          LOCK_FILE="$DEPLOY_DIR/database/.sync.lock"
          MAX_WAIT=2700
          WAITED=0
          INTERVAL=30

          # Open the file read-only (never create it: the pipeline container's user must own it)
          # and try the lock. If the file vanished in between, the sync has just finished.
          lock_held() {
            [ -f "$LOCK_FILE" ] || return 1
            if { flock -n 9; } 9<"$LOCK_FILE" 2>/dev/null; then
              return 1
            fi
            [ -f "$LOCK_FILE" ]
          }

          while lock_held; do
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "Error: Database sync is still running after 45 minutes ($LOCK_FILE). Aborting deploy."
              exit 1
            fi

            echo "Database sync is in progress ($LOCK_FILE exists). Waiting ${INTERVAL}s (${WAITED}s/${MAX_WAIT}s elapsed)..."
            sleep "$INTERVAL"
            WAITED=$((WAITED + INTERVAL))
          done

          docker compose up -d --build

      - name: Verify service health
        run: |
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS http://127.0.0.1:8000/

