<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lehekülge ei leitud — Riigivaade</title>
    <style>
      :root {
        --color-bg-base: #f8fafc;
        --color-panel: rgba(255, 255, 255, 0.9);
        --color-panel-border: rgba(226, 232, 240, 0.8);
        --color-text-main: #0f172a;
        --color-text-muted: #64748b;
        --color-primary: #315b84;
        --color-primary-hover: #264766;
        --color-bg-subtle: #f1f5f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg-base: #0b0f19;
          --color-panel: rgba(25, 33, 50, 0.75);
          --color-panel-border: rgba(255, 255, 255, 0.08);
          --color-text-main: #f8fafc;
          --color-text-muted: #94a3b8;
          --color-primary: #3b82f6;
          --color-primary-hover: #2563eb;
          --color-bg-subtle: rgba(255, 255, 255, 0.05);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-bg-base);
        color: var(--color-text-main);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .panel {
        background: var(--color-panel);
        border: 1px solid var(--color-panel-border);
        border-radius: 16px;
        padding: 3rem 1.5rem;
        text-align: center;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
      }
      .icon-wrap {
        display: inline-flex;
        padding: 1rem;
        border-radius: 50%;
        background: var(--color-bg-subtle);
        margin-bottom: 1rem;
      }
      .icon-wrap svg {
        width: 48px;
        height: 48px;
        stroke: var(--color-primary);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.5rem 0;
        font-weight: 700;
      }
      p {
        color: var(--color-text-muted);
        margin: 0 0 2rem 0;
        line-height: 1.6;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        background: var(--color-primary);
        color: #ffffff;
        padding: 0.65rem 1.25rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 500;
        transition: background 0.15s ease;
      }
      a.btn:hover {
        background: var(--color-primary-hover);
      }
      a.btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <main class="panel" role="main">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>
      <h1>404 – Lehekülge ei leitud</h1>
      <p>Otsitud aadressi ei eksisteeri või on see teisaldatud.</p>
      <a href="/" class="btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        <span>Tagasi avalehele</span>
      </a>
    </main>
  </body>
</html>
