services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riigikogu-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./database:/app/database
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1024M

